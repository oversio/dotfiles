unbind r
bind r source-file ~/.tmux.conf

unbind C-b
set -g prefix C-a
bind C-a send-prefix


bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R

bind -r m resize-pane -Z

unbind %
bind | split-window -h -c "#{pane_current_path}"

unbind '"'
bind \\ split-window -v -c "#{pane_current_path}"

bind c new-window -c "#{pane_current_path}"

# Sessions
bind-key C-x kill-session

# Setup tmux behaviors 
set -g mouse on                  # enable mouse support
set -g base-index 1              # start indexing windows at 1 instead of 0
set -g detach-on-destroy off     # don't exit from tmux when closing a session
set -g renumber-windows on       # renumber all windows when any window is closed
set -g set-clipboard on          # use system clipboard
set -g status-position top       # macOS / darwin style
#set-option -g status-position top
set -g pane-active-border-style 'fg=magenta,bg=default'
set -g pane-border-style 'fg=brightblack,bg=default'
set -g focus-events on

# Image rendering (kitty graphics protocol via snacks.nvim / image.nvim)
set -gq allow-passthrough on
set -g visual-activity off

# Main plugins
set -g @plugin 'tmux-plugins/tpm'

# Theme
# set -g @plugin 'catppuccin/tmux'
set -g @plugin 'omerxx/catppuccin-tmux'

# Set theme configuration
set -g @catppuccin_window_left_separator ""
set -g @catppuccin_window_right_separator " "
set -g @catppuccin_window_middle_separator " █"
set -g @catppuccin_window_number_position "right"

set -g @catppuccin_window_default_fill "number"
set -g @catppuccin_window_default_text "#W"

set -g @catppuccin_window_current_fill "number"
set -g @catppuccin_window_current_text "#W"

set -g @catppuccin_status_modules_left "directory"
set -g @catppuccin_status_modules_right "session"
set -g @catppuccin_status_left_separator  " "
set -g @catppuccin_status_right_separator ""
set -g @catppuccin_status_fill "icon"
set -g @catppuccin_status_connect_separator "no"

set -g @catppuccin_directory_text "#{pane_current_path}"
# Setup tmux-floax plugin
unbind f
set -g @plugin 'omerxx/tmux-floax'
set -g @floax-width '80%'
set -g @floax-height '80%'
set -g @floax-border-color 'magenta'
set -g @floax-text-color 'blue'
set -g @floax-bind 'f'

# Setup tmux-resurrect plugin
set -g @plugin 'christoomey/vim-tmux-navigator'

# Two-line status bar: line 0 = path + session, line 1 = windows (full width)
# (`set -g status 2` lives after the tpm line: the theme resets `status` to "on")
set -g status-format[0] '#[align=left]#{T:status-left}#[align=right]#{T:status-right}'
set -g status-format[1] '#[align=left]#{W:#{E:window-status-format},#{E:window-status-current-format}}'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'

# Must come after tpm, otherwise the theme overrides it back to "on"
set -g status 2
